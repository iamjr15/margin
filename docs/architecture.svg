<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Margin system architecture</title>
  <desc id="description">Three horizontal workflows show PDF ingestion into a canonical paper model, grounded evidence review, and approval-gated editing and export.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0 0 8 4 0 8Z" fill="#807d73" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity="0.08" stdDeviation="6" />
    </filter>
    <style>
      .lane { fill: #ffffff; stroke: #dedbd2; stroke-width: 1.5; }
      .node { fill: #f7f6f2; stroke: #cfcbc0; stroke-width: 1.5; filter: url(#shadow); }
      .source { fill: #fff7e8; stroke: #e8c778; }
      .guard { fill: #edf8f2; stroke: #82b99c; }
      .decision { fill: #1d1d1a; stroke: #1d1d1a; }
      .line { fill: none; stroke: #807d73; stroke-linecap: round; stroke-width: 2; marker-end: url(#arrow); }
      .return { fill: none; stroke: #b0aca2; stroke-dasharray: 6 7; stroke-linecap: round; stroke-width: 1.7; marker-end: url(#arrow); }
      .title { fill: #1d1d1a; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #6f6b62; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane-title { fill: #1d1d1a; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
      .lane-note { fill: #807d73; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #262521; font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #77736a; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .inverse { fill: #ffffff; }
      .edge-label { fill: #807d73; font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="24" fill="#f2f0ea" />
  <text class="title" x="48" y="52">Margin system architecture</text>
  <text class="subtitle" x="48" y="78">One canonical paper model; bounded model decisions; deterministic validation and mutation.</text>

  <rect class="lane" x="32" y="106" width="1336" height="166" rx="18" />
  <text class="lane-title" x="58" y="143">INGESTION</text>
  <text class="lane-note" x="58" y="163">Citation-aware parsing</text>

  <rect class="node" x="210" y="142" width="170" height="90" rx="14" />
  <text class="label" x="295" y="181">Research PDF</text>
  <text class="detail" x="295" y="204">type, size, hash guard</text>

  <path class="line" d="M380 187H416" />
  <rect class="node" x="420" y="142" width="170" height="90" rx="14" />
  <text class="label" x="505" y="181">GROBID</text>
  <text class="detail" x="505" y="204">layout-aware TEI</text>

  <path class="line" d="M590 187H626" />
  <rect class="node" x="630" y="142" width="230" height="90" rx="14" />
  <text class="label" x="745" y="178">Deterministic projector</text>
  <text class="detail" x="745" y="201">targets, sections, warnings</text>

  <path class="line" d="M860 187H896" />
  <rect class="node guard" x="900" y="142" width="250" height="90" rx="14" />
  <text class="label" x="1025" y="178">Typed Paper IR</text>
  <text class="detail" x="1025" y="201">stable anchors + CSL-JSON</text>

  <rect class="lane" x="32" y="292" width="1336" height="166" rx="18" />
  <text class="lane-title" x="58" y="329">EVIDENCE REVIEW</text>
  <text class="lane-note" x="58" y="349">Provider-grounded findings</text>

  <rect class="node guard" x="210" y="328" width="150" height="90" rx="14" />
  <text class="label" x="285" y="367">Paper IR</text>
  <text class="detail" x="285" y="390">bounded claims</text>

  <path class="line" d="M360 373H396" />
  <rect class="node" x="400" y="328" width="190" height="90" rx="14" />
  <text class="label" x="495" y="367">Review orchestrator</text>
  <text class="detail" x="495" y="390">resolve + discover</text>

  <path class="line" d="M590 373H626" />
  <rect class="node source" x="630" y="316" width="235" height="114" rx="14" />
  <text class="label" x="747.5" y="351">Academic providers</text>
  <text class="detail" x="747.5" y="374">Semantic Scholar</text>
  <text class="detail" x="747.5" y="394">OpenAlex</text>

  <path class="line" d="M865 373H901" />
  <rect class="node guard" x="905" y="328" width="205" height="90" rx="14" />
  <text class="label" x="1007.5" y="367">Grounding validator</text>
  <text class="detail" x="1007.5" y="390">IDs + exact evidence</text>

  <path class="line" d="M1110 373H1146" />
  <rect class="node" x="1150" y="328" width="170" height="90" rx="14" />
  <text class="label" x="1235" y="367">Inline findings</text>
  <text class="detail" x="1235" y="390">provenance visible</text>

  <rect class="lane" x="32" y="478" width="1336" height="238" rx="18" />
  <text class="lane-title" x="58" y="515">EDIT + EXPORT</text>
  <text class="lane-note" x="58" y="535">Approval-gated mutation</text>

  <rect class="node guard" x="210" y="528" width="150" height="90" rx="14" />
  <text class="label" x="285" y="567">Paper IR</text>
  <text class="detail" x="285" y="590">current version</text>

  <path class="line" d="M360 573H396" />
  <rect class="node" x="400" y="528" width="190" height="90" rx="14" />
  <text class="label" x="495" y="567">Constrained planner</text>
  <text class="detail" x="495" y="590">one supported intent</text>

  <path class="line" d="M590 573H626" />
  <rect class="node" x="630" y="528" width="190" height="90" rx="14" />
  <text class="label" x="725" y="567">Typed operations</text>
  <text class="detail" x="725" y="590">no free-form patch</text>

  <path class="line" d="M820 573H856" />
  <rect class="node guard" x="860" y="528" width="190" height="90" rx="14" />
  <text class="label" x="955" y="567">Citation invariants</text>
  <text class="detail" x="955" y="590">preserve + validate</text>

  <path class="line" d="M1050 573H1086" />
  <rect class="node decision" x="1090" y="528" width="190" height="90" rx="45" />
  <text class="label inverse" x="1185" y="567">Author approval</text>
  <text class="detail inverse" x="1185" y="590">approve or reject</text>

  <path class="line" d="M1185 618V646" />
  <rect class="node guard" x="1025" y="650" width="320" height="44" rx="12" />
  <text class="label" x="1185" y="678">Immutable child version → citeproc export</text>
  <text class="edge-label" x="1196" y="640">APPROVE</text>

  <path class="return" d="M1090 606C1010 706 430 706 360 612" />
  <text class="edge-label" x="684" y="696">REJECT · PAPER UNCHANGED</text>
</svg>
