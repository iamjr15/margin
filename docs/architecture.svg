<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" aria-labelledby="title description" role="img" viewBox="0 0 1400 760"><title id="title">Margin system architecture</title><desc id="description">Three horizontal workflows show PDF ingestion into a canonical paper model, grounded evidence review, and approval-gated editing and export.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#807d73" d="M0 0 8 4 0 8Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity=".08" stdDeviation="6"/></filter><style>.lane,.node{fill:#fff;stroke:#dedbd2;stroke-width:1.5}.node{fill:#f7f6f2;stroke:#cfcbc0;filter:url(#shadow)}.source{fill:#fff7e8;stroke:#e8c778}.guard{fill:#edf8f2;stroke:#82b99c}.decision{fill:#1d1d1a;stroke:#1d1d1a}.line,.return{fill:none;stroke:#807d73;stroke-linecap:round;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#b0aca2;stroke-dasharray:6 7;stroke-width:1.7}.title{fill:#1d1d1a;font:700 28px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{fill:#6f6b62;font:400 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.lane-title{fill:#1d1d1a;font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:.04em}.lane-note{fill:#807d73;font:400 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail,.label{text-anchor:middle}.label{fill:#262521;font:650 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail{fill:#77736a;font:400 11px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.inverse{fill:#fff}.edge-label{fill:#807d73;font:600 10px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style></defs><rect width="1400" height="760" fill="#f2f0ea" rx="24"/><text x="48" y="52" class="title">Margin system architecture</text><text x="48" y="78" class="subtitle">One canonical paper model; bounded model decisions; deterministic validation and mutation.</text><rect width="1336" height="166" x="32" y="106" class="lane" rx="18"/><text x="58" y="143" class="lane-title">INGESTION</text><text x="58" y="163" class="lane-note">Citation-aware parsing</text><rect width="170" height="90" x="210" y="142" class="node" rx="14"/><text x="295" y="181" class="label">Research PDF</text><text x="295" y="204" class="detail">type, size, hash guard</text><path d="M380 187H416" class="line"/><rect width="170" height="90" x="420" y="142" class="node" rx="14"/><text x="505" y="181" class="label">GROBID</text><text x="505" y="204" class="detail">layout-aware TEI</text><path d="M590 187H626" class="line"/><rect width="230" height="90" x="630" y="142" class="node" rx="14"/><text x="745" y="178" class="label">Deterministic projector</text><text x="745" y="201" class="detail">targets, sections, warnings</text><path d="M860 187H896" class="line"/><rect width="250" height="90" x="900" y="142" class="node guard" rx="14"/><text x="1025" y="178" class="label">Typed Paper IR</text><text x="1025" y="201" class="detail">stable anchors + CSL-JSON</text><rect width="1336" height="166" x="32" y="292" class="lane" rx="18"/><text x="58" y="329" class="lane-title">EVIDENCE REVIEW</text><text x="58" y="349" class="lane-note">Provider-grounded findings</text><rect width="150" height="90" x="210" y="328" class="node guard" rx="14"/><text x="285" y="367" class="label">Paper IR</text><text x="285" y="390" class="detail">bounded claims</text><path d="M360 373H396" class="line"/><rect width="190" height="90" x="400" y="328" class="node" rx="14"/><text x="495" y="367" class="label">Review orchestrator</text><text x="495" y="390" class="detail">resolve + discover</text><path d="M590 373H626" class="line"/><rect width="235" height="114" x="630" y="316" class="node source" rx="14"/><text x="747.5" y="351" class="label">Academic providers</text><text x="747.5" y="374" class="detail">Semantic Scholar</text><text x="747.5" y="394" class="detail">OpenAlex</text><path d="M865 373H901" class="line"/><rect width="205" height="90" x="905" y="328" class="node guard" rx="14"/><text x="1007.5" y="367" class="label">Grounding validator</text><text x="1007.5" y="390" class="detail">IDs + exact evidence</text><path d="M1110 373H1146" class="line"/><rect width="170" height="90" x="1150" y="328" class="node" rx="14"/><text x="1235" y="367" class="label">Inline findings</text><text x="1235" y="390" class="detail">provenance visible</text><rect width="1336" height="238" x="32" y="478" class="lane" rx="18"/><text x="58" y="515" class="lane-title">EDIT + EXPORT</text><text x="58" y="535" class="lane-note">Approval-gated mutation</text><rect width="150" height="90" x="210" y="528" class="node guard" rx="14"/><text x="285" y="567" class="label">Paper IR</text><text x="285" y="590" class="detail">current version</text><path d="M360 573H396" class="line"/><rect width="190" height="90" x="400" y="528" class="node" rx="14"/><text x="495" y="567" class="label">Constrained planner</text><text x="495" y="590" class="detail">one supported intent</text><path d="M590 573H626" class="line"/><rect width="190" height="90" x="630" y="528" class="node" rx="14"/><text x="725" y="567" class="label">Typed operations</text><text x="725" y="590" class="detail">no free-form patch</text><path d="M820 573H856" class="line"/><rect width="190" height="90" x="860" y="528" class="node guard" rx="14"/><text x="955" y="567" class="label">Citation invariants</text><text x="955" y="590" class="detail">preserve + validate</text><path d="M1050 573H1086" class="line"/><rect width="190" height="90" x="1090" y="528" class="node decision" rx="45"/><text x="1185" y="567" class="label inverse">Author approval</text><text x="1185" y="590" class="detail inverse">approve or reject</text><path d="M1185 618V646" class="line"/><rect width="320" height="44" x="1025" y="650" class="node guard" rx="12"/><text x="1185" y="678" class="label">Immutable child version → citeproc export</text><text x="1196" y="640" class="edge-label">APPROVE</text><path d="M1090 606C1010 706 430 706 360 612" class="return"/><text x="684" y="696" class="edge-label">REJECT · PAPER UNCHANGED</text></svg>