<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" aria-labelledby="title description" role="img" viewBox="0 0 1400 560"><title id="title">Citation parsing pipeline</title><desc id="description">Four clear stages show guarded PDF ingestion, GROBID extraction, deterministic projection, and the canonical typed paper model.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="#77736a" d="M0 0 9 4.5 0 9Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d1d1a" flood-opacity=".08" stdDeviation="6"/></filter><style>.node,.stage{stroke-width:1.5}.stage{fill:#fff;stroke:#d8d4ca}.node{fill:#f8f7f3;stroke:#cfcbc0;filter:url(#shadow)}.warm{fill:#fff7e8;stroke:#e4bd58}.safe{fill:#edf8f2;stroke:#73b28f}.line{fill:none;stroke:#77736a;stroke-linecap:round;stroke-width:2.2;marker-end:url(#arrow)}.divider{stroke:#ddd9cf;stroke-width:1}.title{fill:#1d1d1a;font:700 29px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{fill:#706c63;font:400 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.step{fill:#77736a;font:700 11px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:.08em}.detail,.label{text-anchor:middle}.label{fill:#24231f;font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail{fill:#6f6b62;font:400 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.item{fill:#4c4942;font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.chip{fill:#fff;stroke:#d8d4ca;stroke-width:1}.chiptext,.note{fill:#5f5b53;font:650 10.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;text-anchor:middle}.note{fill:#6f6b62;font:500 11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style></defs><rect width="1400" height="560" fill="#f2f0ea" rx="24"/><text x="42" y="50" class="title">Citation parsing pipeline</text><text x="42" y="76" class="subtitle">A single left-to-right path keeps statistical extraction separate from deterministic citation semantics.</text><rect width="292" height="374" x="32" y="106" class="stage" rx="18"/><text x="56" y="137" class="step">01 · INGEST</text><rect width="244" height="276" x="56" y="160" class="node" rx="16"/><text x="178" y="202" class="label">Research PDF</text><text x="178" y="225" class="detail">Validate before persistence</text><line x1="78" x2="278" y1="246" y2="246" class="divider"/><text x="84" y="279" class="item">✓ PDF MIME and signature</text><text x="84" y="312" class="item">✓ 20 MB size guard</text><text x="84" y="345" class="item">✓ SHA-256 source identity</text><text x="84" y="378" class="item">✓ Original bytes retained</text><path d="M324 293H350" class="line"/><rect width="270" height="374" x="356" y="106" class="stage" rx="18"/><text x="380" y="137" class="step">02 · EXTRACT</text><rect width="222" height="276" x="380" y="160" class="node warm" rx="16"/><text x="491" y="202" class="label">GROBID</text><text x="491" y="225" class="detail">processFulltextDocument</text><line x1="402" x2="580" y1="246" y2="246" class="divider"/><text x="410" y="279" class="item">• Layout and reading order</text><text x="410" y="312" class="item">• Stable XML identifiers</text><text x="410" y="345" class="item">• Sentence segmentation</text><text x="410" y="378" class="item">• Bibliography structures</text><rect width="144" height="25" x="419" y="397" class="chip" rx="12.5"/><text x="491" y="414" class="chiptext">OUTPUT · TEI XML</text><path d="M626 293H652" class="line"/><rect width="376" height="374" x="658" y="106" class="stage" rx="18"/><text x="682" y="137" class="step">03 · PROJECT</text><rect width="328" height="276" x="682" y="160" class="node" rx="16"/><text x="846" y="198" class="label">Deterministic projector</text><text x="846" y="220" class="detail">TEI becomes application-owned semantics</text><rect width="136" height="63" x="708" y="249" class="chip" rx="12"/><text x="776" y="273" class="chiptext">BIBLIOGRAPHY</text><text x="776" y="295" class="detail">CSL-JSON records</text><rect width="124" height="63" x="860" y="249" class="chip" rx="12"/><text x="922" y="273" class="chiptext">STRUCTURE</text><text x="922" y="295" class="detail">stable sentences</text><path fill="none" stroke="#9b978d" stroke-width="1.7" d="M776 312V337H846M922 312V337H846"/><rect width="218" height="66" x="737" y="337" class="safe" rx="13"/><text x="846" y="364" class="chiptext">BIND CITATION TARGETS</text><text x="846" y="386" class="detail">bibr → CitationNode anchors</text><path d="M1034 293H1060" class="line"/><rect width="302" height="374" x="1066" y="106" class="stage" rx="18"/><text x="1090" y="137" class="step">04 · CANONICALIZE</text><rect width="254" height="276" x="1090" y="160" class="node safe" rx="16"/><text x="1217" y="202" class="label">Typed Paper IR</text><text x="1217" y="225" class="detail">The only downstream document model</text><line x1="1112" x2="1322" y1="246" y2="246" class="divider"/><text x="1122" y="279" class="item">✓ Stable citation anchors</text><text x="1122" y="312" class="item">✓ Canonical CSL library</text><text x="1122" y="345" class="item">✓ Sections and sentences</text><text x="1122" y="378" class="item">✓ Visible parse warnings</text><rect width="91" height="25" x="1116" y="397" class="chip" rx="12.5"/><text x="1161.5" y="414" class="chiptext">IEEE / APA</text><rect width="101" height="25" x="1217" y="397" class="chip" rx="12.5"/><text x="1267.5" y="414" class="chiptext">STYLE PICKER</text><rect width="964" height="31" x="218" y="505" fill="#e8e5dd" rx="15.5"/><text x="700" y="525" class="note">Failure remains explicit: NEEDS_OCR · typed parse error · preserved unresolved callout</text></svg>