<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Citation parsing pipeline</title>
  <desc id="description">Four clear stages show guarded PDF ingestion, GROBID extraction, deterministic projection, and the canonical typed paper model.</desc>
  <defs>
    <marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path d="M0 0 9 4.5 0 9Z" fill="#77736a" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" flood-color="#1d1d1a" flood-opacity="0.08" stdDeviation="6" /></filter>
    <style>
      .stage{fill:#fff;stroke:#d8d4ca;stroke-width:1.5}.node{fill:#f8f7f3;stroke:#cfcbc0;stroke-width:1.5;filter:url(#shadow)}.warm{fill:#fff7e8;stroke:#e4bd58}.safe{fill:#edf8f2;stroke:#73b28f}.line{fill:none;stroke:#77736a;stroke-linecap:round;stroke-width:2.2;marker-end:url(#arrow)}.divider{stroke:#ddd9cf;stroke-width:1}.title{fill:#1d1d1a;font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.subtitle{fill:#706c63;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.step{fill:#77736a;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em}.label{fill:#24231f;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.detail{fill:#6f6b62;font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.item{fill:#4c4942;font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.chip{fill:#fff;stroke:#d8d4ca;stroke-width:1}.chiptext{fill:#5f5b53;font:650 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.note{fill:#6f6b62;font:500 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect width="1400" height="560" rx="24" fill="#f2f0ea" />
  <text class="title" x="42" y="50">Citation parsing pipeline</text>
  <text class="subtitle" x="42" y="76">A single left-to-right path keeps statistical extraction separate from deterministic citation semantics.</text>

  <rect class="stage" x="32" y="106" width="292" height="374" rx="18" />
  <text class="step" x="56" y="137">01 · INGEST</text>
  <rect class="node" x="56" y="160" width="244" height="276" rx="16" />
  <text class="label" x="178" y="202">Research PDF</text>
  <text class="detail" x="178" y="225">Validate before persistence</text>
  <line class="divider" x1="78" y1="246" x2="278" y2="246" />
  <text class="item" x="84" y="279">✓ PDF MIME and signature</text>
  <text class="item" x="84" y="312">✓ 20 MB size guard</text>
  <text class="item" x="84" y="345">✓ SHA-256 source identity</text>
  <text class="item" x="84" y="378">✓ Original bytes retained</text>

  <path class="line" d="M324 293H350" />
  <rect class="stage" x="356" y="106" width="270" height="374" rx="18" />
  <text class="step" x="380" y="137">02 · EXTRACT</text>
  <rect class="node warm" x="380" y="160" width="222" height="276" rx="16" />
  <text class="label" x="491" y="202">GROBID</text>
  <text class="detail" x="491" y="225">processFulltextDocument</text>
  <line class="divider" x1="402" y1="246" x2="580" y2="246" />
  <text class="item" x="410" y="279">• Layout and reading order</text>
  <text class="item" x="410" y="312">• Stable XML identifiers</text>
  <text class="item" x="410" y="345">• Sentence segmentation</text>
  <text class="item" x="410" y="378">• Bibliography structures</text>
  <rect class="chip" x="419" y="397" width="144" height="25" rx="12.5" /><text class="chiptext" x="491" y="414">OUTPUT · TEI XML</text>

  <path class="line" d="M626 293H652" />
  <rect class="stage" x="658" y="106" width="376" height="374" rx="18" />
  <text class="step" x="682" y="137">03 · PROJECT</text>
  <rect class="node" x="682" y="160" width="328" height="276" rx="16" />
  <text class="label" x="846" y="198">Deterministic projector</text>
  <text class="detail" x="846" y="220">TEI becomes application-owned semantics</text>
  <rect class="chip" x="708" y="249" width="136" height="63" rx="12" />
  <text class="chiptext" x="776" y="273">BIBLIOGRAPHY</text><text class="detail" x="776" y="295">CSL-JSON records</text>
  <rect class="chip" x="860" y="249" width="124" height="63" rx="12" />
  <text class="chiptext" x="922" y="273">STRUCTURE</text><text class="detail" x="922" y="295">stable sentences</text>
  <path d="M776 312V337H846M922 312V337H846" fill="none" stroke="#9b978d" stroke-width="1.7" />
  <rect class="safe" x="737" y="337" width="218" height="66" rx="13" />
  <text class="chiptext" x="846" y="364">BIND CITATION TARGETS</text>
  <text class="detail" x="846" y="386">bibr → CitationNode anchors</text>

  <path class="line" d="M1034 293H1060" />
  <rect class="stage" x="1066" y="106" width="302" height="374" rx="18" />
  <text class="step" x="1090" y="137">04 · CANONICALIZE</text>
  <rect class="node safe" x="1090" y="160" width="254" height="276" rx="16" />
  <text class="label" x="1217" y="202">Typed Paper IR</text>
  <text class="detail" x="1217" y="225">The only downstream document model</text>
  <line class="divider" x1="1112" y1="246" x2="1322" y2="246" />
  <text class="item" x="1122" y="279">✓ Stable citation anchors</text>
  <text class="item" x="1122" y="312">✓ Canonical CSL library</text>
  <text class="item" x="1122" y="345">✓ Sections and sentences</text>
  <text class="item" x="1122" y="378">✓ Visible parse warnings</text>
  <rect class="chip" x="1116" y="397" width="91" height="25" rx="12.5" /><text class="chiptext" x="1161.5" y="414">IEEE / APA</text>
  <rect class="chip" x="1217" y="397" width="101" height="25" rx="12.5" /><text class="chiptext" x="1267.5" y="414">STYLE PICKER</text>

  <rect x="218" y="505" width="964" height="31" rx="15.5" fill="#e8e5dd" />
  <text class="note" x="700" y="525">Failure remains explicit: NEEDS_OCR · typed parse error · preserved unresolved callout</text>
</svg>
