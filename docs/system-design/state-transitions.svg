<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" aria-labelledby="title description" role="img" viewBox="0 0 1400 650"><title id="title">Document workflow state transitions</title><desc id="description">The primary lifecycle moves from uploaded to parsing to ready. Parsing can require OCR or fail. Review, edit, and export are temporary cycles that always return to ready.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="#77736a" d="M0 0 9 4.5 0 9Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1d1d1a" flood-opacity=".08" stdDeviation="6"/></filter><style>.state{fill:#fff;stroke:#d3cfc5;stroke-width:1.5;filter:url(#shadow)}.ready{fill:#edf8f2;stroke:#73b28f}.active{fill:#f3effb;stroke:#a795c7}.warn{fill:#fff7e8;stroke:#e4bd58}.fail{fill:#fff1ef;stroke:#d7867b}.group{fill:#fff;stroke:#d8d4ca;stroke-width:1.5}.branch,.line{fill:none;stroke-linecap:round;marker-end:url(#arrow)}.line{stroke:#77736a;stroke-width:2.2}.branch{stroke:#918d83;stroke-width:1.8}.title{fill:#1d1d1a;font:700 29px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{fill:#706c63;font:400 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail,.label{text-anchor:middle}.label{fill:#24231f;font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail{fill:#706c63;font:400 11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.section{fill:#77736a;font:700 11px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:.08em}.edge{fill:#77736a;font:700 10px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mini{fill:#edf8f2;stroke:#73b28f;stroke-width:1.3}.minitext{fill:#3f6f54;font:700 10px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;text-anchor:middle}</style></defs><rect width="1400" height="650" fill="#f2f0ea" rx="24"/><text x="42" y="50" class="title">Persistence and document states</text><text x="42" y="76" class="subtitle">The main lifecycle is linear; review, editing, and export are isolated cycles around the canonical READY state.</text><rect width="792" height="500" x="32" y="105" class="group" rx="18"/><text x="58" y="138" class="section">PRIMARY LIFECYCLE</text><circle cx="72" cy="220" r="10" fill="#1d1d1a"/><path d="M82 220H119" class="line"/><rect width="180" height="88" x="125" y="176" class="state" rx="44"/><text x="215" y="215" class="label">UPLOADED</text><text x="215" y="238" class="detail">source persisted</text><path d="M305 220H354" class="line"/><rect width="180" height="88" x="360" y="176" class="state active" rx="44"/><text x="450" y="215" class="label">PARSING</text><text x="450" y="238" class="detail">GROBID + projector</text><path d="M540 220H589" class="line"/><rect width="190" height="88" x="595" y="176" class="state ready" rx="44"/><text x="690" y="215" class="label">READY</text><text x="690" y="238" class="detail">current version available</text><text x="58" y="323" class="section">PARSING OUTCOMES</text><path fill="none" stroke="#918d83" stroke-width="1.8" d="M450 264V352H270V375"/><path d="M270 352V375" class="branch"/><path d="M450 352H630V375" class="branch"/><rect width="210" height="88" x="165" y="380" class="state warn" rx="44"/><text x="270" y="419" class="label">NEEDS_OCR</text><text x="270" y="442" class="detail">no usable text layer</text><rect width="210" height="88" x="525" y="380" class="state fail" rx="44"/><text x="630" y="419" class="label">FAILED</text><text x="630" y="442" class="detail">typed parse error</text><text x="450" y="514" class="detail">Only successful parsing reaches READY.</text><rect width="514" height="500" x="854" y="105" class="group" rx="18"/><text x="880" y="138" class="section">TEMPORARY OPERATIONS · EACH RETURNS TO READY</text><rect width="78" height="32" x="884" y="174" class="mini" rx="16"/><text x="923" y="195" class="minitext">READY</text><path d="M962 190H1001" class="line"/><rect width="190" height="74" x="1007" y="153" class="state active" rx="37"/><text x="1102" y="186" class="label">REVIEWING</text><text x="1102" y="206" class="detail">bounded research</text><path d="M1197 190H1236" class="line"/><rect width="78" height="32" x="1242" y="174" class="mini" rx="16"/><text x="1281" y="195" class="minitext">READY</text><text x="1206" y="174" class="edge">RESULT STORED</text><rect width="78" height="32" x="884" y="302" class="mini" rx="16"/><text x="923" y="323" class="minitext">READY</text><path d="M962 318H1001" class="line"/><rect width="190" height="74" x="1007" y="281" class="state active" rx="37"/><text x="1102" y="314" class="label">EDITING</text><text x="1102" y="334" class="detail">proposal planning</text><path d="M1197 318H1236" class="line"/><rect width="78" height="32" x="1242" y="302" class="mini" rx="16"/><text x="1281" y="323" class="minitext">READY</text><text x="1203" y="302" class="edge">PROPOSAL WAITING</text><rect width="78" height="32" x="884" y="430" class="mini" rx="16"/><text x="923" y="451" class="minitext">READY</text><path d="M962 446H1001" class="line"/><rect width="190" height="74" x="1007" y="409" class="state active" rx="37"/><text x="1102" y="442" class="label">EXPORTING</text><text x="1102" y="462" class="detail">citeproc + PDF</text><path d="M1197 446H1236" class="line"/><rect width="78" height="32" x="1242" y="430" class="mini" rx="16"/><text x="1281" y="451" class="minitext">READY</text><text x="1212" y="430" class="edge">BUNDLE READY</text><rect width="378" height="34" x="922" y="535" fill="#e8e5dd" rx="17"/><text x="1111" y="557" class="detail">No temporary operation replaces the canonical state.</text></svg>