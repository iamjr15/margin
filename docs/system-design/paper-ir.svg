<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" aria-labelledby="title description" role="img" viewBox="0 0 1400 430"><title id="title">Canonical paper intermediate representation</title><desc id="description">The paper contains sections, paragraphs, sentences, citation nodes, and linked CSL reference records.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#817d73" d="M0 0 8 4 0 8Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity=".08" stdDeviation="5"/></filter><style>.node{fill:#fff;stroke:#d3cfc5;stroke-width:1.5;filter:url(#shadow)}.root{fill:#edf8f2;stroke:#82b99c}.ref{fill:#fff7e8;stroke:#e5c46c}.line{fill:none;stroke:#817d73;stroke-width:2;marker-end:url(#arrow)}.title{fill:#1d1d1a;font:700 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{fill:#77736a;font:400 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail,.label{text-anchor:middle}.label{fill:#262521;font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail{fill:#77736a;font:400 10.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style></defs><rect width="1400" height="430" fill="#f2f0ea" rx="24"/><text x="42" y="49" class="title">Canonical paper intermediate representation</text><text x="42" y="74" class="subtitle">Strict Zod schemas keep structural identity separate from rendered citation text.</text><rect width="205" height="190" x="38" y="130" class="node root" rx="16"/><text x="140.5" y="165" class="label">Paper</text><text x="140.5" y="192" class="detail">title · authors · abstract</text><text x="140.5" y="212" class="detail">sections[] · references[]</text><text x="140.5" y="232" class="detail">citationStyle · warnings[]</text><text x="140.5" y="252" class="detail">provenance</text><path d="M243 225H274" class="line"/><rect width="180" height="148" x="280" y="151" class="node" rx="15"/><text x="370" y="190" class="label">Section</text><text x="370" y="218" class="detail">id · title · level</text><text x="370" y="238" class="detail">paragraphs[]</text><path d="M460 225H491" class="line"/><rect width="180" height="148" x="497" y="151" class="node" rx="15"/><text x="587" y="190" class="label">Paragraph</text><text x="587" y="218" class="detail">id · kind</text><text x="587" y="238" class="detail">sentences[]</text><path d="M677 225H708" class="line"/><rect width="180" height="148" x="714" y="151" class="node" rx="15"/><text x="804" y="190" class="label">Sentence</text><text x="804" y="218" class="detail">stable id</text><text x="804" y="238" class="detail">ordered nodes[]</text><path d="M894 225H925" class="line"/><rect width="190" height="148" x="931" y="151" class="node" rx="15"/><text x="1026" y="190" class="label">CitationNode</text><text x="1026" y="218" class="detail">anchorId · raw</text><text x="1026" y="238" class="detail">referenceIds[]</text><path d="M1121 225H1152" class="line"/><rect width="204" height="190" x="1158" y="130" class="node ref" rx="16"/><text x="1260" y="165" class="label">ReferenceRecord</text><text x="1260" y="192" class="detail">id · canonical CSL</text><text x="1260" y="212" class="detail">raw · confidence · status</text><text x="1260" y="232" class="detail">providerIds</text><text x="1260" y="264" class="detail">rendered only via citeproc</text></svg>