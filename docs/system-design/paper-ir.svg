<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">Canonical paper intermediate representation</title>
  <desc id="description">The paper contains sections, paragraphs, sentences, citation nodes, and linked CSL reference records.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0 0 8 4 0 8Z" fill="#817d73" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity="0.08" stdDeviation="5" /></filter>
    <style>.node{fill:#fff;stroke:#d3cfc5;stroke-width:1.5;filter:url(#shadow)}.root{fill:#edf8f2;stroke:#82b99c}.ref{fill:#fff7e8;stroke:#e5c46c}.line{fill:none;stroke:#817d73;stroke-width:2;marker-end:url(#arrow)}.title{fill:#1d1d1a;font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.subtitle{fill:#77736a;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#262521;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.detail{fill:#77736a;font:400 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}</style>
  </defs>
  <rect width="1400" height="430" rx="24" fill="#f2f0ea" />
  <text class="title" x="42" y="49">Canonical paper intermediate representation</text>
  <text class="subtitle" x="42" y="74">Strict Zod schemas keep structural identity separate from rendered citation text.</text>
  <rect class="node root" x="38" y="130" width="205" height="190" rx="16" />
  <text class="label" x="140.5" y="165">Paper</text>
  <text class="detail" x="140.5" y="192">title · authors · abstract</text><text class="detail" x="140.5" y="212">sections[] · references[]</text><text class="detail" x="140.5" y="232">citationStyle · warnings[]</text><text class="detail" x="140.5" y="252">provenance</text>
  <path class="line" d="M243 225H274" />
  <rect class="node" x="280" y="151" width="180" height="148" rx="15" /><text class="label" x="370" y="190">Section</text><text class="detail" x="370" y="218">id · title · level</text><text class="detail" x="370" y="238">paragraphs[]</text>
  <path class="line" d="M460 225H491" />
  <rect class="node" x="497" y="151" width="180" height="148" rx="15" /><text class="label" x="587" y="190">Paragraph</text><text class="detail" x="587" y="218">id · kind</text><text class="detail" x="587" y="238">sentences[]</text>
  <path class="line" d="M677 225H708" />
  <rect class="node" x="714" y="151" width="180" height="148" rx="15" /><text class="label" x="804" y="190">Sentence</text><text class="detail" x="804" y="218">stable id</text><text class="detail" x="804" y="238">ordered nodes[]</text>
  <path class="line" d="M894 225H925" />
  <rect class="node" x="931" y="151" width="190" height="148" rx="15" /><text class="label" x="1026" y="190">CitationNode</text><text class="detail" x="1026" y="218">anchorId · raw</text><text class="detail" x="1026" y="238">referenceIds[]</text>
  <path class="line" d="M1121 225H1152" />
  <rect class="node ref" x="1158" y="130" width="204" height="190" rx="16" /><text class="label" x="1260" y="165">ReferenceRecord</text><text class="detail" x="1260" y="192">id · canonical CSL</text><text class="detail" x="1260" y="212">raw · confidence · status</text><text class="detail" x="1260" y="232">providerIds</text><text class="detail" x="1260" y="264">rendered only via citeproc</text>
</svg>
