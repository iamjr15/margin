<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">Review and editing trust boundary</title>
  <desc id="description">Providers supply normalized sources, the model makes bounded structured judgments, deterministic validation precedes human approval, and only integrity-checked transactions mutate the paper.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0 0 8 4 0 8Z" fill="#817d73" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity="0.08" stdDeviation="5" /></filter>
    <style>.node{fill:#fff;stroke:#d3cfc5;stroke-width:1.5;filter:url(#shadow)}.source{fill:#fff7e8;stroke:#e5c46c}.safe{fill:#edf8f2;stroke:#82b99c}.model{fill:#f3effb;stroke:#a795c7}.decision{fill:#1d1d1a;stroke:#1d1d1a}.line{fill:none;stroke:#817d73;stroke-linecap:round;stroke-width:2;marker-end:url(#arrow)}.title{fill:#1d1d1a;font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.subtitle{fill:#77736a;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#262521;font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.detail{fill:#77736a;font:400 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.inverse{fill:#fff}.boundary{fill:none;stroke:#a795c7;stroke-dasharray:7 7;stroke-width:1.7}.boundary-label{fill:#7f6ca3;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.05em}.edge{fill:#77736a;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
  </defs>
  <rect width="1400" height="520" rx="24" fill="#f2f0ea" />
  <text class="title" x="42" y="49">Review and editing trust boundary</text>
  <text class="subtitle" x="42" y="74">The model can judge supplied data; it cannot create metadata or commit document state.</text>
  <rect class="boundary" x="690" y="93" width="238" height="192" rx="18" />
  <text class="boundary-label" x="708" y="116">BOUNDED MODEL ZONE</text>
  <rect class="node safe" x="36" y="146" width="145" height="90" rx="14" /><text class="label" x="108.5" y="185">Paper IR</text><text class="detail" x="108.5" y="208">immutable input</text>
  <path class="line" d="M181 191H207" />
  <rect class="node" x="212" y="146" width="185" height="90" rx="14" /><text class="label" x="304.5" y="185">Orchestrator</text><text class="detail" x="304.5" y="208">bounded tool calls</text>
  <path class="line" d="M397 191H423" />
  <rect class="node source" x="428" y="130" width="200" height="122" rx="14" /><text class="label" x="528" y="166">Provider adapters</text><text class="detail" x="528" y="190">Semantic Scholar</text><text class="detail" x="528" y="210">OpenAlex</text><text class="detail" x="528" y="230">normalized WorkSource</text>
  <path class="line" d="M628 191H704" />
  <rect class="node model" x="709" y="130" width="200" height="122" rx="14" /><text class="label" x="809" y="174">Structured model</text><text class="detail" x="809" y="198">supplied IDs only</text><text class="detail" x="809" y="218">schema-constrained output</text>
  <path class="line" d="M909 191H935" />
  <rect class="node safe" x="940" y="146" width="190" height="90" rx="14" /><text class="label" x="1035" y="185">Validator</text><text class="detail" x="1035" y="208">IDs + exact evidence</text>
  <path class="line" d="M1130 191H1156" />
  <rect class="node" x="1161" y="146" width="200" height="90" rx="14" /><text class="label" x="1261" y="185">Finding / proposal</text><text class="detail" x="1261" y="208">reasoning visible</text>
  <path class="line" d="M1261 236V284H1015V318" />
  <rect class="node decision" x="910" y="318" width="210" height="96" rx="48" /><text class="label inverse" x="1015" y="359">Human decision</text><text class="detail inverse" x="1015" y="382">approve or reject</text>
  <path class="line" d="M910 366H734" />
  <rect class="node safe" x="490" y="321" width="240" height="90" rx="14" /><text class="label" x="610" y="360">Integrity + transaction</text><text class="detail" x="610" y="383">stale-version check</text>
  <path class="line" d="M490 366H324" />
  <rect class="node safe" x="94" y="321" width="226" height="90" rx="14" /><text class="label" x="207" y="360">Immutable child version</text><text class="detail" x="207" y="383">approved mutation only</text>
  <path class="line" d="M1120 366H1200" />
  <rect class="node" x="1205" y="321" width="156" height="90" rx="14" /><text class="label" x="1283" y="360">No mutation</text><text class="detail" x="1283" y="383">rejected</text>
  <text class="edge" x="790" y="355">APPROVE</text><text class="edge" x="1146" y="355">REJECT</text>
</svg>
