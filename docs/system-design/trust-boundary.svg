<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" aria-labelledby="title description" role="img" viewBox="0 0 1400 520"><title id="title">Review and editing trust boundary</title><desc id="description">Providers supply normalized sources, the model makes bounded structured judgments, deterministic validation precedes human approval, and only integrity-checked transactions mutate the paper.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#817d73" d="M0 0 8 4 0 8Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#1d1d1a" flood-opacity=".08" stdDeviation="5"/></filter><style>.node{fill:#fff;stroke:#d3cfc5;stroke-width:1.5;filter:url(#shadow)}.source{fill:#fff7e8;stroke:#e5c46c}.safe{fill:#edf8f2;stroke:#82b99c}.model{fill:#f3effb;stroke:#a795c7}.decision{fill:#1d1d1a;stroke:#1d1d1a}.line{fill:none;stroke:#817d73;stroke-linecap:round;stroke-width:2;marker-end:url(#arrow)}.title{fill:#1d1d1a;font:700 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{fill:#77736a;font:400 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail,.label{text-anchor:middle}.label{fill:#262521;font:650 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.detail{fill:#77736a;font:400 10.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.inverse{fill:#fff}.boundary{fill:none;stroke:#a795c7;stroke-dasharray:7 7;stroke-width:1.7}.boundary-label,.edge{font:700 10px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.boundary-label{fill:#7f6ca3;letter-spacing:.05em}.edge{fill:#77736a}</style></defs><rect width="1400" height="520" fill="#f2f0ea" rx="24"/><text x="42" y="49" class="title">Review and editing trust boundary</text><text x="42" y="74" class="subtitle">The model can judge supplied data; it cannot create metadata or commit document state.</text><rect width="238" height="192" x="690" y="93" class="boundary" rx="18"/><text x="708" y="116" class="boundary-label">BOUNDED MODEL ZONE</text><rect width="145" height="90" x="36" y="146" class="node safe" rx="14"/><text x="108.5" y="185" class="label">Paper IR</text><text x="108.5" y="208" class="detail">immutable input</text><path d="M181 191H207" class="line"/><rect width="185" height="90" x="212" y="146" class="node" rx="14"/><text x="304.5" y="185" class="label">Orchestrator</text><text x="304.5" y="208" class="detail">bounded tool calls</text><path d="M397 191H423" class="line"/><rect width="200" height="122" x="428" y="130" class="node source" rx="14"/><text x="528" y="166" class="label">Provider adapters</text><text x="528" y="190" class="detail">Semantic Scholar</text><text x="528" y="210" class="detail">OpenAlex</text><text x="528" y="230" class="detail">normalized WorkSource</text><path d="M628 191H704" class="line"/><rect width="200" height="122" x="709" y="130" class="node model" rx="14"/><text x="809" y="174" class="label">Structured model</text><text x="809" y="198" class="detail">supplied IDs only</text><text x="809" y="218" class="detail">schema-constrained output</text><path d="M909 191H935" class="line"/><rect width="190" height="90" x="940" y="146" class="node safe" rx="14"/><text x="1035" y="185" class="label">Validator</text><text x="1035" y="208" class="detail">IDs + exact evidence</text><path d="M1130 191H1156" class="line"/><rect width="200" height="90" x="1161" y="146" class="node" rx="14"/><text x="1261" y="185" class="label">Finding / proposal</text><text x="1261" y="208" class="detail">reasoning visible</text><path d="M1261 236V284H1015V318" class="line"/><rect width="210" height="96" x="910" y="318" class="node decision" rx="48"/><text x="1015" y="359" class="label inverse">Human decision</text><text x="1015" y="382" class="detail inverse">approve or reject</text><path d="M910 366H734" class="line"/><rect width="240" height="90" x="490" y="321" class="node safe" rx="14"/><text x="610" y="360" class="label">Integrity + transaction</text><text x="610" y="383" class="detail">stale-version check</text><path d="M490 366H324" class="line"/><rect width="226" height="90" x="94" y="321" class="node safe" rx="14"/><text x="207" y="360" class="label">Immutable child version</text><text x="207" y="383" class="detail">approved mutation only</text><path d="M1120 366H1200" class="line"/><rect width="156" height="90" x="1205" y="321" class="node" rx="14"/><text x="1283" y="360" class="label">No mutation</text><text x="1283" y="383" class="detail">rejected</text><text x="790" y="355" class="edge">APPROVE</text><text x="1146" y="355" class="edge">REJECT</text></svg>